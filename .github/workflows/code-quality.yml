name: code-quality
run-name: Code Quality

on:
  push:
    branches:
      - "develop"
    paths:
      - "apps/**"
      - "packages/**"
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
  workflow_dispatch:

jobs:
  install-dependencies:
    name: Setup & Cache Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v4
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun

      - name: Cache node_modules
        uses: actions/cache@v4
        id: modules-cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        if: steps.modules-cache.outputs.cache-hit != 'true'
        run: bun install

  lint:
    needs: install-dependencies
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('**/bun.lock') }}

      - name: Cache & Restore Turbo Task Cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Set Turbo Base Ref
        id: turbo-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            echo "BASE=HEAD~1" >> $GITHUB_OUTPUT
          fi

      - name: Run linter on affected packages
        run: bunx turbo run lint --filter="...[${{ steps.turbo-base.outputs.BASE }}]"

  type-check:
    needs: install-dependencies
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('**/bun.lock') }}

      - name: Cache & Restore Turbo Task Cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Set Turbo Base Ref
        id: turbo-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            echo "BASE=HEAD~1" >> $GITHUB_OUTPUT
          fi

      - name: Run type checker on affected packages
        run: bunx turbo run type-check --filter="...[${{ steps.turbo-base.outputs.BASE }}]"

  test:
    needs: install-dependencies
    name: Test (${{ matrix.app }})
    strategy:
      matrix:
        app:
          - discord-bot
          - workers
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ matrix.app }}-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('**/bun.lock') }}

      - name: Cache & Restore Turbo Task Cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Run tests
        env:
          LOG_LEVEL: fatal
          POSTGRES_DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ matrix.app }}-tests
        run: bunx turbo run test --filter="@flicker/${{ matrix.app }}"
