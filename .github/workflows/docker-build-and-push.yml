name: docker-build-and-push
run-name: Code Quality

on:
  workflow_run:
    workflows: [code-quality]
    types: [completed]

jobs:
  build-and-publish:
    name: Build & Publish ${{ matrix.app }} Docker Image
    strategy:
      matrix:
        app:
          - workers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install Semantic Release and Plugins
        run: npm install --save-dev semantic-release @semantic-release/changelog @semantic-release/git

      - name: Determine version
        id: versioning
        if: github.ref_name == 'main'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags and push strategy
        id: strategy
        run: |
          BRANCH="${{ github.ref_name }}"
          IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/flicker-${{ matrix.app }}"

          if [ "$BRANCH" = "main" ]; then
            # Grab the latest git tag generated by semantic-release (fallback to 0.0.0 if none)
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            # Strip leading 'v' if present
            VERSION="${VERSION#v}"

            echo "push=true" >> $GITHUB_OUTPUT
            echo "tags=$IMAGE:latest,$IMAGE:$VERSION" >> $GITHUB_OUTPUT
            echo "Building and pushing version $VERSION"
          elif [ "$BRANCH" = "develop" ]; then
            echo "push=false" >> $GITHUB_OUTPUT
            echo "tags=$IMAGE:latest-dev" >> $GITHUB_OUTPUT
            echo "Build only, push disabled for $BRANCH"
          else
            echo "push=false" >> $GITHUB_OUTPUT
            echo "tags=$IMAGE:latest-$BRANCH" >> $GITHUB_OUTPUT
            echo "Build only, push disabled for $BRANCH"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.strategy.outputs.push }}
          tags: ${{ steps.strategy.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/flicker-${{ matrix.app }}:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/flicker-${{ matrix.app }}:cache,mode=max
